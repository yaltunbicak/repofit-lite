[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repofit-lite"
version = "0.1.0"
description = "Find the best open-source repos for your project"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["open-source", "repository", "analysis", "scoring", "llm", "github", "gitlab"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "rich>=13.7",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "aiolimiter>=1.2",
    "license-expression>=30.0",
]

[project.scripts]
repofit = "repofit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.22",
    "hypothesis>=6.100",
    "pypdf>=4.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
